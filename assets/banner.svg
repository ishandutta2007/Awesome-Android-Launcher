<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Dynamic Background Elements (Kept in Background behind Text) -->
  <g opacity="0.25">
    <!-- Floating Pulsing Orbs -->
    <circle cx="150" cy="80" r="100" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cy" values="80;100;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="240" r="120" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cy" values="240;210;240" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="60" r="70" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="cx" values="900;920;900" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Wave Lines in Background -->
  <path d="M 0,220 Q 300,160 600,220 T 1200,220" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3">
    <animate attributeName="d" values="M 0,220 Q 300,160 600,220 T 1200,220; M 0,200 Q 300,240 600,200 T 1200,200; M 0,220 Q 300,160 600,220 T 1200,220" dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M 0,250 Q 300,290 600,240 T 1200,260" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2">
    <animate attributeName="d" values="M 0,250 Q 300,290 600,240 T 1200,260; M 0,260 Q 300,220 600,270 T 1200,240; M 0,250 Q 300,290 600,240 T 1200,260" dur="12s" repeatCount="indefinite" />
  </path>

  <!-- Decorative Android Launcher Tech Icon Silhouette -->
  <g transform="translate(80, 75)" opacity="0.85">
    <rect x="0" y="0" width="110" height="170" rx="18" fill="url(#pillGrad)" stroke="url(#accentGrad)" stroke-width="2" />
    <line x1="35" y1="15" x2="75" y2="15" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Screen Apps -->
    <rect x="18" y="35" width="32" height="32" rx="8" fill="#38bdf8" opacity="0.8" />
    <rect x="60" y="35" width="32" height="32" rx="8" fill="#818cf8" opacity="0.8" />
    <rect x="18" y="80" width="32" height="32" rx="8" fill="#c084fc" opacity="0.8" />
    <rect x="60" y="80" width="32" height="32" rx="8" fill="#34d399" opacity="0.8" />
    <circle cx="55" cy="142" r="8" fill="none" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Foreground Content: Title & Subtitle (Always Crisp & Visible) -->
  <g transform="translate(230, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="115" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">📱 ANDROID ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#accentGrad)">Android Launcher</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Curated List of Commercial Launchers &amp; Open-Source Projects
    </text>

    <!-- Key Focus Tags -->
    <g transform="translate(0, 210)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">✨ Minimalism</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="224" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">🔍 Search-First Nav</text>

      <!-- Tag 3 -->
      <rect x="319" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="401" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">🌱 Digital Wellbeing</text>
    </g>
  </g>
</svg>
